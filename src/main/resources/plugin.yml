name: MiraPunishments
version: 0.1.1
main: gg.mira.punishments.MiraPunishmentsPlugin
api-version: '1.21'
author: FiveSOCE
description: Persistent moderation punishments, case history and MiraCore audit integration.
depend: [MiraCore]
softdepend: [MiraStaff, MiraReports]
commands:
  punish:
    description: Punishment administration
    usage: /punish <history|case|note|reload>
    permission: mirapunishments.staff
  history:
    description: View a player's punishment history
    usage: /history <player> [page]
    permission: mirapunishments.staff
  warn:
    description: Warn a player
    usage: /warn <player> <reason>
    permission: mirapunishments.warn
  mute:
    description: Mute a player
    usage: /mute <player> <duration|perm> <reason>
    permission: mirapunishments.mute
  unmute:
    description: Unmute a player
    usage: /unmute <player>
    permission: mirapunishments.mute
  miraban:
    description: Ban a player through MiraPunishments
    usage: /miraban <player> <duration|perm> <reason>
    permission: mirapunishments.ban
  miraunban:
    description: Unban a player through MiraPunishments
    usage: /miraunban <player>
    permission: mirapunishments.ban
  mirakick:
    description: Kick a player and record the action
    usage: /mirakick <player> <reason>
    permission: mirapunishments.kick
permissions:
  mirapunishments.staff:
    default: op
  mirapunishments.warn:
    default: op
  mirapunishments.mute:
    default: op
  mirapunishments.ban:
    default: op
  mirapunishments.kick:
    default: op

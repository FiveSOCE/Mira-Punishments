name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: MiraPunishments-0.1.0
          path: build/libs/MiraPunishments-0.1.0.jar

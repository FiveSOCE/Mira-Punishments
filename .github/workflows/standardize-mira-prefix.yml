name: Standardize Mira chat prefix
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/standardize-mira-prefix.yml' ]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: curl -fsSL https://raw.githubusercontent.com/FiveSOCE/Mira-Bounties/main/tools/standardize_mira_prefix.py -o /tmp/standardize_mira_prefix.py
      - run: python3 /tmp/standardize_mira_prefix.py
      - run: gradle clean build
      - name: Commit migration
        shell: bash
        run: |
          rm -f .github/workflows/standardize-mira-prefix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Standardize Mira chat prefix'
            git push
          fi
